[package]
name = "burrow-client"
version = "1.1.1"
description = "Local-first SSH client"
authors = ["Zukotuutori"]
license = "MIT"
repository = "https://github.com/zukotuutori/burrow-client"
edition = "2021"
rust-version = "1.85"

[lib]
name = "burrow_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2.0.21", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
regex = "1.13.2"
uuid = { version = "1.26.1", features = ["v4"] }
scrypt = "0.11"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
zeroize = { version = "1.9.2", features = ["derive"] }
subtle = "2.6.1"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "4"
tokio = { version = "1.54.1", features = ["full"] }
rand = { version = "0.10", features = ["thread_rng"] }
getrandom = "0.3"
portable-pty = "0.9"
dirs = "7.0.0"
hkdf = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
url = "2.5.9"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
user-idle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[dev-dependencies]
bytes = "1.12.2"
tempfile = "3.27.0"

# scrypt and RSA key generation are unusably slow without optimizations, also in debug builds.
[profile.dev.package."*"]
opt-level = 3
