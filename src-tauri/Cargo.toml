[package]
name = "burrow-client"
version = "1.1.1"
description = "Local-first SSH client"
authors = ["Zukotuutori"]
license = "MIT"
repository = "https://github.com/zukotuutori/burrow-client"
edition = "2021"
rust-version = "1.85"

[lib]
name = "burrow_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
